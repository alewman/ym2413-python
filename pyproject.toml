[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ym2413-python"
version = "0.1.0.dev0"
description = "The Yamaha YM2413 (OPLL) and the VRC7's DS1001, written from documents and measurements"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff==0.16.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/ym2413_python"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["reference", "trash"]

[tool.ruff.format]
# Documents keep their own layout; ruff would otherwise reformat their code blocks.
exclude = ["*.md"]
